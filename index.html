<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Dial+</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    background-size: cover;
    background-position: center;
    height: 100vh;
    overflow: hidden;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
  }

  header {
    text-align: center;
    padding: 25px;
    font-size: 2rem;
    font-weight: 600;
    position: relative;
    z-index: 2;
  }

  .clock {
    position: fixed;
    top: 20px;
    right: 25px;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
    padding: 8px 12px;
    border-radius: 10px;
    z-index: 3;
  }

  .search {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }

  .search input {
    width: 60%;
    max-width: 500px;
    padding: 12px;
    border: none;
    border-radius: 10px 0 0 10px;
    outline: none;
  }

  .search button {
    padding: 12px 16px;
    border: none;
    background: #3b82f6;
    color: white;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
    padding: 10px;
    position: relative;
    z-index: 2;
  }

  .tile {
    width: 110px;
    height: 110px;
    background: rgba(255,255,255,0.1);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: 0.2s;
  }

  .tile:hover {
    transform: scale(1.05);
  }

  .tile img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    object-fit: cover;
    margin-bottom: 6px;
  }

  .tile span {
    font-size: 12px;
    text-align: center;
    max-width: 100px;
  }

  .delete {
    position: absolute;
    top: 5px;
    right: 8px;
    font-size: 14px;
    cursor: pointer;
    opacity: 0.6;
  }

  .delete:hover { opacity: 1; }

  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #3b82f6;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 26px;
    color: white;
    cursor: pointer;
    z-index: 3;
  }

  .panel {
    position: fixed;
    left: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 3;
  }

  .panel button {
    padding: 8px 10px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    color: white;
    cursor: pointer;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .modal-content {
    background: #0f172a;
    padding: 20px;
    border-radius: 12px;
    width: 320px;
  }

  .modal-content input {
    width: 100%;
    margin: 6px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
  }

  .modal-content button {
    width: 100%;
    padding: 10px;
    border: none;
    background: #3b82f6;
    color: white;
    border-radius: 8px;
    margin-top: 8px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="clock" id="clock"></div>

<header>Speed Dial+</header>

<div class="search">
  <form action="https://www.google.com/search" method="GET" style="display:flex;width:100%;justify-content:center;">
    <input name="q" placeholder="Search..." />
    <button>Search</button>
  </form>
</div>

<div class="grid" id="grid"></div>

<!-- controls -->
<div class="panel">
  <button onclick="openModal()">+ Add Site</button>
  <button onclick="setWallpaper()">🖼 Wallpaper</button>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Site</h3>
    <input id="name" placeholder="Name" />
    <input id="url" placeholder="https://example.com" />
    <input id="img" placeholder="Image URL (or leave blank for favicon)" />
    <button onclick="addTile()">Add</button>
  </div>
</div>

<input type="file" id="wallpaperInput" hidden accept="image/*"/>

<script>
let tiles = JSON.parse(localStorage.getItem("tiles") || "[]");

// wallpaper load
document.body.style.backgroundImage =
  localStorage.getItem("wallpaper")
    ? `url(${localStorage.getItem("wallpaper")})`
    : "none";

// clock
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// render tiles
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  tiles.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "tile";

    const img = t.img
      ? t.img
      : `https://www.google.com/s2/favicons?sz=64&domain=${t.url}`;

    div.innerHTML = `
      <div class="delete" onclick="removeTile(${i})">✕</div>
      <img src="${img}" />
      <span>${t.name}</span>
    `;

    div.onclick = (e) => {
      if (e.target.className !== "delete") {
        window.open(t.url, "_blank");
      }
    };

    grid.appendChild(div);
  });

  localStorage.setItem("tiles", JSON.stringify(tiles));
}

// add tile
function addTile() {
  const name = document.getElementById("name").value;
  const url = document.getElementById("url").value;
  const img = document.getElementById("img").value;

  if (!name || !url) return;

  tiles.push({ name, url, img });
  closeModal();
  render();
}

// remove tile
function removeTile(i) {
  tiles.splice(i, 1);
  render();
}

// modal
function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("name").value = "";
  document.getElementById("url").value = "";
  document.getElementById("img").value = "";
}

// wallpaper
function setWallpaper() {
  document.getElementById("wallpaperInput").click();
}

document.getElementById("wallpaperInput").onchange = function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    localStorage.setItem("wallpaper", event.target.result);
    document.body.style.backgroundImage = `url(${event.target.result})`;
  };

  reader.readAsDataURL(file);
};

// close modal click outside
window.onclick = (e) => {
  if (e.target.id === "modal") closeModal();
};

render();
</script>

</body>
</html>
