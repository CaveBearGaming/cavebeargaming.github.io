<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Dial+</title>

<style>
:root {
  --bg: rgba(0,0,0,0.55);
  --card: rgba(255,255,255,0.12);
  --text: white;
}

body.light {
  --bg: rgba(255,255,255,0.65);
  --card: rgba(0,0,0,0.08);
  --text: black;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background-size: cover;
  background-position: center;
  height: 100vh;
  overflow: hidden;
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  backdrop-filter: blur(var(--blur, 10px));
}

header {
  text-align: center;
  padding: 15px;
  font-size: 2rem;
  font-weight: 600;
  position: relative;
  z-index: 2;
}

.clock {
  position: fixed;
  top: 12px;
  right: 12px;
  background: var(--card);
  padding: 8px 12px;
  border-radius: 10px;
  z-index: 3;
}

.search {
  display: flex;
  justify-content: center;
  margin-bottom: 15px;
  position: relative;
  z-index: 2;
}

.search input {
  width: 60%;
  max-width: 500px;
  padding: 12px;
  border: none;
  border-radius: 10px 0 0 10px;
  outline: none;
}

.search button {
  padding: 12px 16px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 0 10px 10px 0;
  cursor: pointer;
}

.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  padding: 10px;
  position: relative;
  z-index: 2;
}

.tile {
  width: 140px;
  height: 80px;
  background: var(--card);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: grab;
  transition: 0.15s;
}

.tile:active {
  cursor: grabbing;
}

.tile img {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
}

.tile span {
  font-size: 13px;
}

.delete {
  position: absolute;
  top: 5px;
  right: 8px;
  opacity: 0.6;
  cursor: pointer;
}

.panelBtn {
  position: fixed;
  left: 15px;
  bottom: 15px;
  z-index: 3;
  background: var(--card);
  border: none;
  padding: 10px;
  border-radius: 10px;
  color: var(--text);
  cursor: pointer;
}

.settings {
  position: fixed;
  left: 15px;
  bottom: 60px;
  background: var(--card);
  padding: 10px;
  border-radius: 12px;
  display: none;
  flex-direction: column;
  gap: 8px;
  z-index: 4;
}

.settings button {
  border: none;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  background: rgba(255,255,255,0.15);
  color: var(--text);
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #3b82f6;
  border: none;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  color: white;
  font-size: 26px;
  cursor: pointer;
  z-index: 3;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal-content {
  background: #0f172a;
  padding: 20px;
  border-radius: 12px;
  width: 320px;
}

.modal-content input {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.modal-content button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 8px;
  margin-top: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="clock" id="clock"></div>

<header>Speed Dial+</header>

<div class="search">
  <form action="https://www.google.com/search" method="GET" style="display:flex;width:100%;justify-content:center;">
    <input name="q" placeholder="Search the web..." />
    <button>Search</button>
  </form>
</div>

<div class="grid" id="grid"></div>

<!-- settings -->
<button class="panelBtn" onclick="toggleSettings()">⚙ Settings</button>

<div class="settings" id="settings">
  <button onclick="openModal()">Add Tile</button>
  <button onclick="toggleTheme()">Theme</button>
  <button onclick="toggleBlur()">Blur</button>
  <button onclick="setWallpaper()">Wallpaper</button>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <input id="name" placeholder="Name" />
    <input id="url" placeholder="URL" />
    <input id="img" placeholder="Image URL" />
    <button onclick="addTile()">Add</button>
  </div>
</div>

<input type="file" id="wallpaperInput" hidden accept="image/*"/>

<script>
let tiles = JSON.parse(localStorage.getItem("tiles") || "[]");
let theme = localStorage.getItem("theme") || "dark";
let blur = localStorage.getItem("blur") || "10";

document.body.className = theme;
document.documentElement.style.setProperty("--blur", blur + "px");

document.body.style.backgroundImage =
  localStorage.getItem("wallpaper")
    ? `url(${localStorage.getItem("wallpaper")})`
    : "none";

/* ⏰ FIXED TIME (no timezone bugs) */
function updateClock() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  document.getElementById("clock").innerText = `${h}:${m}`;
}
setInterval(updateClock, 1000);
updateClock();

/* render */
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  tiles.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "tile";
    div.draggable = true;

    const img = t.img || `https://www.google.com/s2/favicons?sz=64&domain=${t.url}`;

    div.innerHTML = `
      <div class="delete" onclick="removeTile(${i})">✕</div>
      <img src="${img}">
      <span>${t.name}</span>
    `;

    div.onclick = (e) => {
      if (!e.target.classList.contains("delete")) {
        window.open(t.url, "_blank");
      }
    };

    // drag system
    div.addEventListener("dragstart", e => {
      e.dataTransfer.setData("index", i);
    });

    div.addEventListener("dragover", e => e.preventDefault());

    div.addEventListener("drop", e => {
      const from = e.dataTransfer.getData("index");
      const to = i;
      const moved = tiles.splice(from, 1)[0];
      tiles.splice(to, 0, moved);
      render();
    });

    grid.appendChild(div);
  });

  localStorage.setItem("tiles", JSON.stringify(tiles));
}

/* add/remove */
function addTile() {
  tiles.push({
    name: name.value,
    url: url.value,
    img: img.value
  });
  modal.style.display = "none";
  render();
}

function removeTile(i) {
  tiles.splice(i, 1);
  render();
}

/* settings */
function toggleSettings() {
  const s = document.getElementById("settings");
  s.style.display = s.style.display === "flex" ? "none" : "flex";
}

function toggleTheme() {
  theme = theme === "dark" ? "light" : "dark";
  document.body.className = theme;
  localStorage.setItem("theme", theme);
}

function toggleBlur() {
  blur = blur === "0" ? "10" : "0";
  document.documentElement.style.setProperty("--blur", blur + "px");
  localStorage.setItem("blur", blur);
}

function setWallpaper() {
  wallpaperInput.click();
}

wallpaperInput.onchange = (e) => {
  const r = new FileReader();
  r.onload = ev => {
    localStorage.setItem("wallpaper", ev.target.result);
    document.body.style.backgroundImage = `url(${ev.target.result})`;
  };
  r.readAsDataURL(e.target.files[0]);
};

/* modal */
function openModal() {
  modal.style.display = "flex";
}

window.onclick = (e) => {
  if (e.target.id === "modal") modal.style.display = "none";
};

render();
</script>

</body>
</html>
