<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Dial Pro</title>

<style>
:root {
  --bg: rgba(0,0,0,0.55);
  --card: rgba(255,255,255,0.12);
  --text: white;
  --blur: 10px;
}

body.light {
  --bg: rgba(255,255,255,0.6);
  --card: rgba(0,0,0,0.08);
  --text: black;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
  color: var(--text);
  background-size: cover;
  background-position: center;
  height: 100vh;
  overflow: hidden;
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  backdrop-filter: blur(var(--blur));
}

header {
  text-align: center;
  padding: 18px;
  font-size: 2rem;
  font-weight: 600;
  position: relative;
  z-index: 2;
}

.clock {
  position: fixed;
  top: 15px;
  right: 15px;
  padding: 8px 12px;
  background: var(--card);
  border-radius: 10px;
  z-index: 5;
}

.search {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
}

.search input {
  width: 60%;
  max-width: 500px;
  padding: 12px;
  border: none;
  border-radius: 10px 0 0 10px;
  outline: none;
}

.search button {
  padding: 12px 16px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 0 10px 10px 0;
}

/* SNAP GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  padding: 10px;
  position: relative;
  z-index: 2;
}

/* RECTANGLE TILES */
.tile {
  height: 70px;
  background: var(--card);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: grab;
  user-select: none;
}

.tile:active { cursor: grabbing; }

.tile img {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
}

/* FOLDERS */
.folder {
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 10px;
}

.folder-title {
  font-size: 13px;
  margin-bottom: 6px;
  cursor: pointer;
  opacity: 0.8;
}

.folder-content {
  display: grid;
  gap: 8px;
}

.settings-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: var(--card);
  border: none;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  z-index: 5;
}

.settings {
  position: fixed;
  bottom: 70px;
  left: 20px;
  background: #111827;
  padding: 12px;
  border-radius: 12px;
  display: none;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
}

.settings button {
  padding: 8px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #3b82f6;
  border: none;
  color: white;
  font-size: 26px;
  z-index: 5;
}

.modal {
  position: fixed;
  inset: 0;
  display: none;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.modal-content {
  background: #0f172a;
  padding: 20px;
  border-radius: 12px;
  width: 320px;
}

.modal-content input {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.modal-content button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="overlay"></div>
<div class="clock" id="clock"></div>
<header>Speed Dial Pro</header>

<div class="search">
  <form action="https://www.google.com/search" method="GET" style="display:flex;">
    <input name="q" placeholder="Search the web..." />
    <button>Search</button>
  </form>
</div>

<div class="grid" id="grid"></div>

<button class="settings-btn" onclick="toggleSettings()">⚙</button>

<div class="settings" id="settings">
  <button onclick="toggleTheme()">Theme</button>
  <button onclick="toggleBlur()">Blur</button>
  <button onclick="setWallpaper()">Wallpaper</button>
  <button onclick="openModal()">Add Tile</button>
  <button onclick="addFolder()">Add Folder</button>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="name" placeholder="Name" />
    <input id="url" placeholder="URL (leave empty for folder)" />
    <input id="img" placeholder="Image URL (optional)" />
    <button onclick="addTile()">Add</button>
  </div>
</div>

<input type="file" id="wallpaperInput" hidden />

<script>
let tiles = JSON.parse(localStorage.getItem("tiles") || "[]");
let theme = localStorage.getItem("theme") || "dark";

document.body.className = theme;

if (localStorage.getItem("wallpaper")) {
  document.body.style.backgroundImage = `url(${localStorage.getItem("wallpaper")})`;
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
setInterval(updateClock, 1000);
updateClock();

function toggleSettings() {
  const s = document.getElementById("settings");
  s.style.display = s.style.display === "flex" ? "none" : "flex";
}

function toggleTheme() {
  theme = theme === "dark" ? "light" : "dark";
  document.body.className = theme;
  localStorage.setItem("theme", theme);
}

function toggleBlur() {
  const current = getComputedStyle(document.documentElement)
    .getPropertyValue("--blur").trim();

  document.documentElement.style.setProperty(
    "--blur",
    current === "0px" ? "10px" : "0px"
  );
}

function setWallpaper() {
  wallpaperInput.click();
}

wallpaperInput.onchange = (e) => {
  const r = new FileReader();
  r.onload = (ev) => {
    localStorage.setItem("wallpaper", ev.target.result);
    document.body.style.backgroundImage = `url(${ev.target.result})`;
  };
  r.readAsDataURL(e.target.files[0]);
};

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  tiles.forEach((t, i) => {

    /* FOLDER */
    if (t.type === "folder") {
      const f = document.createElement("div");
      f.className = "folder";

      const title = document.createElement("div");
      title.className = "folder-title";
      title.innerText = "📁 " + t.name;

      const content = document.createElement("div");
      content.className = "folder-content";

      t.items.forEach(item => {
        const d = document.createElement("div");
        d.className = "tile";
        d.innerHTML = `<img src='https://www.google.com/s2/favicons?sz=64&domain=${item.url}'><span>${item.name}</span>`;
        d.onclick = () => window.open(item.url);
        content.appendChild(d);
      });

      let open = true;
      title.onclick = () => {
        open = !open;
        content.style.display = open ? "grid" : "none";
      };

      f.appendChild(title);
      f.appendChild(content);
      grid.appendChild(f);
      return;
    }

    /* TILE */
    const div = document.createElement("div");
    div.className = "tile";
    div.draggable = true;

    const img = t.img || `https://www.google.com/s2/favicons?sz=64&domain=${t.url}`;

    div.innerHTML = `<img src="${img}"><span>${t.name}</span>`;

    div.onclick = () => window.open(t.url, "_blank");

    grid.appendChild(div);
  });

  localStorage.setItem("tiles", JSON.stringify(tiles));
}

function openModal() {
  modal.style.display = "flex";
}

function addTile() {
  tiles.push({ name: name.value, url: url.value, img: img.value });
  modal.style.display = "none";
  render();
}

function addFolder() {
  tiles.push({
    type: "folder",
    name: "New Folder",
    items: []
  });
  render();
}

window.onclick = (e) => {
  if (e.target.id === "modal") modal.style.display = "none";
};

render();
</script>
</body>
</html>
