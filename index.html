<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Dial+</title>

<style>
:root {
  --bg-dark: rgba(0,0,0,0.55);
  --card: rgba(255,255,255,0.12);
  --text: white;
}

body.light {
  --bg-dark: rgba(255,255,255,0.6);
  --card: rgba(0,0,0,0.08);
  --text: black;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background-size: cover;
  background-position: center;
  height: 100vh;
  overflow: hidden;
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-dark);
  backdrop-filter: blur(var(--blur, 10px));
}

header {
  text-align: center;
  padding: 20px;
  font-size: 2rem;
  font-weight: 600;
  position: relative;
  z-index: 2;
}

.clock {
  position: fixed;
  top: 15px;
  right: 15px;
  background: var(--card);
  padding: 8px 12px;
  border-radius: 10px;
  z-index: 3;
}

.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  padding: 10px;
  position: relative;
  z-index: 2;
}

.tile {
  width: 140px;
  height: 80px;
  background: var(--card);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  cursor: pointer;
  position: relative;
  transition: 0.15s;
}

.tile:hover {
  transform: scale(1.03);
}

.tile img {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
}

.tile span {
  font-size: 13px;
  overflow: hidden;
}

.folder {
  width: 100%;
  margin: 10px 0;
  text-align: center;
  font-size: 14px;
  opacity: 0.8;
}

.delete {
  position: absolute;
  top: 5px;
  right: 8px;
  font-size: 14px;
  opacity: 0.6;
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #3b82f6;
  border: none;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  color: white;
  font-size: 26px;
  cursor: pointer;
  z-index: 3;
}

.panel {
  position: fixed;
  left: 15px;
  bottom: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 3;
}

.panel button {
  border: none;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal-content {
  background: #0f172a;
  padding: 20px;
  border-radius: 12px;
  width: 320px;
}

.modal-content input {
  width: 100%;
  margin: 6px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.modal-content button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #3b82f6;
  color: white;
  border-radius: 8px;
  margin-top: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="clock" id="clock"></div>

<header>Speed Dial+</header>

<div class="grid" id="grid"></div>

<div class="panel">
  <button onclick="openModal()">+ Add</button>
  <button onclick="toggleTheme()">Theme</button>
  <button onclick="toggleBlur()">Blur</button>
  <button onclick="setWallpaper()">Wallpaper</button>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="name" placeholder="Name" />
    <input id="url" placeholder="URL" />
    <input id="img" placeholder="Image URL (optional)" />
    <input id="folder" placeholder="Folder (e.g. Work)" />
    <button onclick="addTile()">Add</button>
  </div>
</div>

<input type="file" id="wallpaperInput" hidden accept="image/*"/>

<script>
let tiles = JSON.parse(localStorage.getItem("tiles") || "[]");
let theme = localStorage.getItem("theme") || "dark";
let blur = localStorage.getItem("blur") || "10";

document.body.className = theme;
document.documentElement.style.setProperty("--blur", blur + "px");

document.body.style.backgroundImage =
  localStorage.getItem("wallpaper")
    ? `url(${localStorage.getItem("wallpaper")})`
    : "none";

// FIXED CLOCK (real system time)
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
setInterval(updateClock, 1000);
updateClock();

// render
function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let currentFolder = "";

  tiles.forEach((t, i) => {
    if (t.folder !== currentFolder) {
      currentFolder = t.folder;
      const f = document.createElement("div");
      f.className = "folder";
      f.innerText = currentFolder || "Main";
      grid.appendChild(f);
    }

    const div = document.createElement("div");
    div.className = "tile";

    const img = t.img || `https://www.google.com/s2/favicons?sz=64&domain=${t.url}`;

    div.innerHTML = `
      <div class="delete" onclick="removeTile(${i})">✕</div>
      <img src="${img}">
      <span>${t.name}</span>
    `;

    div.onclick = (e) => {
      if (!e.target.classList.contains("delete")) {
        window.open(t.url, "_blank");
      }
    };

    grid.appendChild(div);
  });

  localStorage.setItem("tiles", JSON.stringify(tiles));
}

// add
function addTile() {
  tiles.push({
    name: name.value,
    url: url.value,
    img: img.value,
    folder: folder.value
  });

  modal.style.display = "none";
  render();
}

// remove
function removeTile(i) {
  tiles.splice(i, 1);
  render();
}

// modal
function openModal() {
  modal.style.display = "flex";
}

// theme
function toggleTheme() {
  theme = theme === "dark" ? "light" : "dark";
  document.body.className = theme;
  localStorage.setItem("theme", theme);
}

// blur
function toggleBlur() {
  blur = blur == "0" ? "10" : "0";
  document.documentElement.style.setProperty("--blur", blur + "px");
  localStorage.setItem("blur", blur);
}

// wallpaper
function setWallpaper() {
  wallpaperInput.click();
}

wallpaperInput.onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = (ev) => {
    localStorage.setItem("wallpaper", ev.target.result);
    document.body.style.backgroundImage = `url(${ev.target.result})`;
  };

  reader.readAsDataURL(file);
};

render();
</script>

</body>
</html>
