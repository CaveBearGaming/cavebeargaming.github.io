<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Dial</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    color: white;
  }

  header {
    text-align: center;
    padding: 30px 10px 10px;
    font-size: 2rem;
    font-weight: 600;
  }

  .search {
    display: flex;
    justify-content: center;
    margin: 10px 0 30px;
  }

  .search input {
    width: 60%;
    max-width: 500px;
    padding: 12px;
    border-radius: 10px 0 0 10px;
    border: none;
    outline: none;
  }

  .search button {
    padding: 12px 16px;
    border: none;
    background: #3b82f6;
    color: white;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
    padding: 10px;
  }

  .tile {
    width: 110px;
    height: 110px;
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: 0.2s;
  }

  .tile:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.15);
  }

  .tile img {
    width: 40px;
    height: 40px;
    margin-bottom: 8px;
    border-radius: 10px;
  }

  .tile span {
    font-size: 12px;
    text-align: center;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete {
    position: absolute;
    top: 5px;
    right: 8px;
    font-size: 14px;
    opacity: 0.6;
    cursor: pointer;
  }

  .delete:hover {
    opacity: 1;
  }

  .add-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #3b82f6;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 28px;
    border: none;
    color: white;
    cursor: pointer;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
  }

  .modal-content {
    background: #0f172a;
    padding: 20px;
    border-radius: 12px;
    width: 300px;
  }

  .modal-content input {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
  }

  .modal-content button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>

<body>

<header>Speed Dial</header>

<div class="search">
  <form action="https://www.google.com/search" method="GET" style="display:flex;width:100%;justify-content:center;">
    <input name="q" placeholder="Search the web..." />
    <button>Search</button>
  </form>
</div>

<div class="grid" id="grid"></div>

<button class="add-btn" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Site</h3>
    <input id="name" placeholder="Name" />
    <input id="url" placeholder="https://example.com" />
    <button onclick="addTile()">Add</button>
  </div>
</div>

<script>
let tiles = JSON.parse(localStorage.getItem("tiles") || "[]");

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  tiles.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "tile";

    div.innerHTML = `
      <div class="delete" onclick="removeTile(${i})">✕</div>
      <img src="https://www.google.com/s2/favicons?sz=64&domain=${t.url}" />
      <span>${t.name}</span>
    `;

    div.onclick = (e) => {
      if (e.target.className !== "delete") {
        window.open(t.url, "_blank");
      }
    };

    grid.appendChild(div);
  });

  localStorage.setItem("tiles", JSON.stringify(tiles));
}

function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function addTile() {
  const name = document.getElementById("name").value;
  const url = document.getElementById("url").value;

  if (!name || !url) return;

  tiles.push({ name, url });
  document.getElementById("modal").style.display = "none";
  document.getElementById("name").value = "";
  document.getElementById("url").value = "";

  render();
}

function removeTile(i) {
  tiles.splice(i, 1);
  render();
}

window.onclick = (e) => {
  if (e.target.id === "modal") {
    document.getElementById("modal").style.display = "none";
  }
};

render();
</script>

</body>
</html>
