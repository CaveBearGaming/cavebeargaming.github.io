<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Google+Sans+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --md-primary: #1a73e8;
    --md-on-primary: #ffffff;
    --md-primary-container: #d3e3fd;
    --md-on-primary-container: #041e49;
    --md-secondary: #4285f4;
    --md-surface: #fef7ff;
    --md-surface-variant: #e7e0ec;
    --md-on-surface: #1c1b1f;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-outline-variant: #cac4d0;
    --md-bg: #fffbfe;
    --md-tonal: #e8f0fe;
    --md-shadow: rgba(0,0,0,0.08);
    --md-shadow-md: rgba(0,0,0,0.15);
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 28px;
    --radius-full: 50px;
    font-family: 'Google Sans', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary: #a8c7fa;
      --md-on-primary: #062e6f;
      --md-primary-container: #0842a0;
      --md-on-primary-container: #d3e3fd;
      --md-surface: #1c1b1f;
      --md-surface-variant: #49454f;
      --md-on-surface: #e6e1e5;
      --md-on-surface-variant: #cac4d0;
      --md-outline: #938f99;
      --md-outline-variant: #49454f;
      --md-bg: #141218;
      --md-tonal: #1a2848;
      --md-shadow: rgba(0,0,0,0.4);
      --md-shadow-md: rgba(0,0,0,0.6);
    }
  }

  body {
    background: var(--md-bg);
    color: var(--md-on-surface);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 0%, rgba(66,133,244,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 500px 300px at 80% 10%, rgba(234,67,53,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 400px 400px at 60% 80%, rgba(52,168,83,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .content { position: relative; z-index: 1; width: 100%; max-width: 800px; }

  /* Header */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 36px;
  }

  .google-logo {
    display: flex;
    align-items: center;
    gap: 2px;
    font-family: 'Google Sans Display', sans-serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -1px;
    line-height: 1;
  }
  .g-blue { color: #4285f4; }
  .g-red { color: #ea4335; }
  .g-yellow { color: #fbbc05; }
  .g-green { color: #34a853; }

  .header-sub {
    font-size: 13px;
    color: var(--md-on-surface-variant);
    letter-spacing: 0.02em;
    margin-top: 2px;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--md-surface);
    border: 1.5px solid var(--md-outline-variant);
    border-radius: var(--radius-full);
    padding: 12px 20px;
    margin-bottom: 40px;
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s;
    width: 100%;
    max-width: 520px;
  }
  .search-bar:hover {
    box-shadow: 0 2px 12px var(--md-shadow-md);
    border-color: var(--md-outline);
  }

  .search-icon { color: var(--md-primary); flex-shrink: 0; }
  .search-placeholder {
    color: var(--md-on-surface-variant);
    font-size: 15px;
    flex: 1;
  }
  .search-divider {
    width: 1px;
    height: 22px;
    background: var(--md-outline-variant);
    flex-shrink: 0;
  }
  .mic-icon { color: var(--md-on-surface-variant); flex-shrink: 0; cursor: pointer; transition: color 0.15s; }
  .mic-icon:hover { color: var(--md-primary); }

  /* Section labels */
  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--md-on-surface-variant);
    margin-bottom: 14px;
    padding-left: 4px;
  }

  /* Featured app (Gemini) */
  .featured-row {
    margin-bottom: 28px;
  }

  .featured-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: linear-gradient(135deg, #e8f0fe 0%, #fce8e6 50%, #e6f4ea 100%);
    border: 1.5px solid rgba(66,133,244,0.15);
    border-radius: var(--radius-lg);
    padding: 22px 28px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  @media (prefers-color-scheme: dark) {
    .featured-card {
      background: linear-gradient(135deg, #1a2848 0%, #2d1a1a 50%, #1a2d1f 100%);
      border-color: rgba(168,199,250,0.15);
    }
  }

  .featured-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }
  .featured-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--md-shadow-md); }
  .featured-card:hover::after { background: rgba(255,255,255,0.06); }
  .featured-card:active { transform: translateY(0); }

  .featured-icon-wrap {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    flex-shrink: 0;
  }

  .featured-info { flex: 1; }
  .featured-name {
    font-family: 'Google Sans Display', sans-serif;
    font-size: 22px;
    font-weight: 500;
    background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .featured-desc {
    font-size: 13px;
    color: var(--md-on-surface-variant);
    line-height: 1.5;
  }

  .featured-badge {
    background: linear-gradient(135deg, #4285f4, #7b68ee);
    color: white;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    flex-shrink: 0;
  }

  /* App grid */
  .apps-section { margin-bottom: 28px; }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }

  .app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: var(--md-surface);
    border: 1.5px solid var(--md-outline-variant);
    border-radius: var(--radius-md);
    padding: 18px 10px 14px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s, border-color 0.18s, background 0.18s;
    position: relative;
    overflow: hidden;
  }

  .app-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--app-tint, rgba(66,133,244,0.0));
    transition: background 0.2s;
    border-radius: inherit;
  }

  .app-card:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 6px 20px var(--md-shadow-md);
    border-color: var(--md-outline);
  }
  .app-card:hover::before { background: var(--app-tint, rgba(66,133,244,0.04)); }
  .app-card:active { transform: translateY(-1px) scale(1.01); }

  .app-icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .app-name {
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    color: var(--md-on-surface);
    line-height: 1.3;
    position: relative;
    z-index: 1;
  }

  /* Ripple effect */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: scale(0);
    animation: ripple-anim 0.5s linear;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #323232;
    color: white;
    padding: 12px 24px;
    border-radius: var(--radius-full);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Clock widget */
  .clock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding: 0 4px;
  }
  .clock-time {
    font-family: 'Google Sans Display', sans-serif;
    font-size: 36px;
    font-weight: 400;
    color: var(--md-on-surface);
    letter-spacing: -0.5px;
  }
  .clock-date {
    font-size: 13px;
    color: var(--md-on-surface-variant);
    margin-top: 2px;
  }
  .weather-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--md-surface);
    border: 1.5px solid var(--md-outline-variant);
    border-radius: var(--radius-full);
    padding: 8px 16px;
  }
  .weather-temp { font-size: 15px; font-weight: 500; }
  .weather-icon { font-size: 20px; }
</style>
</head>

function renderGrid(containerId, items) {
  const grid = document.getElementById(containerId);
  items.forEach((app, i) => {
    const card = document.createElement('a');
    card.className = 'app-card';
    card.href = app.url;
    card.target = '_blank';
    card.rel = 'noopener';
    card.style.setProperty('--app-tint', app.tint);
    card.style.animationDelay = `${i * 60}ms`;

    card.innerHTML = `
      <div class="app-icon-wrap">${app.icon}</div>
      <span class="app-name">${app.name}</span>
    `;

    card.addEventListener('click', (e) => {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = card.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      card.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    grid.appendChild(card);
  });
}

renderGrid('productivity-grid', apps.productivity);
renderGrid('comms-grid', apps.comms);
renderGrid('explore-grid', apps.explore);

function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}`;
  document.getElementById('date').textContent = now.toLocaleDateString('en-AU', { weekday:'long', month:'long', day:'numeric' });
}
updateClock();
setInterval(updateClock, 10000);

function openLink(url) { window.open(url, '_blank'); }
